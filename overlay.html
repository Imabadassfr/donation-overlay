<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Donation Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
<style>
  /* Tokens from the Simply DONATIONS design system. Gotham SSm is Roblox's face; Montserrat is its listed fallback. */
  :root {
    --font-sans: "Gotham SSm", "Montserrat", system-ui, sans-serif;
    --primary: #56FF0E; --primary-light: #AAFF86; --primary-deep: #2FFF00; --money: #18A956;
    --secondary: #FFA537; --secondary-light: #FFE969; --secondary-end: #FFA72C; --accent: #FFAA00;
    --card-blue-1: #0099FF; --card-blue-2: #52EEFF; --card-blue-3: #173AFF; --card-blue-stroke: #00C8FF;
    --card-sunset-1: #FF5050; --card-sunset-2: #FFC890; --card-sunset-3: #FFED85; --card-sunset-stroke: #D47604;
    --surface: #FFFFFF; --row-stroke: #DCDCDC; --ink: #0F223C; --on-color: #FFFFFF;
    --radius-toast: 30px; --radius-pill: 9999px;
    --radius-inner: 15px; /* toast radius minus the card padding, so the message row sits concentric inside it */
    --space-default: 10px; --space-card: 12px; --space-section: 15px;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: var(--font-sans); }

  #Popup {
    position: fixed; left: 50%; top: 32px; width: min(620px, 92vw);
    transform: translateX(-50%); pointer-events: none;
    filter: drop-shadow(0 6px 0 rgba(0, 0, 0, .18));
  }
  #Card {
    position: relative; overflow: hidden; box-sizing: border-box;
    padding: var(--space-section); border-radius: var(--radius-toast);
    border: 2px solid var(--c-stroke);
    background: linear-gradient(45deg, var(--c), var(--c-light), var(--c-deep));
    opacity: 0; transform: translateY(-40px) scale(.82);
  }
  /* Colours per donation level, from the game's DonationEffects.LevelColors (base) with a gloss and a deep stop. */
  #Card { --c: #3EFF30; --c-light: #A8FF9F; --c-deep: #22D914; --c-stroke: #18A956; }
  #Card.L3 { --c: #FFB300; --c-light: #FFE08A; --c-deep: #E08A00; --c-stroke: #B36B00; }
  #Card.L4 { --c: #00C8FF; --c-light: #8CEBFF; --c-deep: #0083D6; --c-stroke: #0069B0; }
  #Card.L5 { --c: #FF40AC; --c-light: #FF9ED2; --c-deep: #D6178A; --c-stroke: #B01070; }
  #Card.L6 { --c: #FF0064; --c-light: #FF7AA8; --c-deep: #C70050; --c-stroke: #99003C; }
  #Card.L7 { --c: #FF0000; --c-light: #FF8A8A; --c-deep: #C40000; --c-stroke: #8F0000; }

  /* Faint tiled pattern + one gloss sweep on entry. */
  #Card::before {
    content: ""; position: absolute; inset: 0; opacity: .14;
    background: radial-gradient(circle, #fff 1.6px, transparent 2.2px) 0 0 / 18px 18px;
  }
  #Card::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%;
    background: linear-gradient(105deg, transparent, rgba(255, 255, 255, .65), transparent);
    transform: translateX(0) skewX(-12deg); opacity: 0;
  }
  #Card.Show { animation: PopIn .55s cubic-bezier(.34, 1.56, .64, 1) forwards; }
  #Card.Show::after { animation: Sweep .9s .35s ease-out forwards; }
  #Card.Hide { animation: PopOut .35s ease-in forwards; }
  @keyframes PopIn { from { opacity: 0; transform: translateY(-40px) scale(.82); } to { opacity: 1; transform: none; } }
  @keyframes PopOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-30px) scale(.94); } }
  @keyframes Sweep { 0% { opacity: 1; transform: translateX(0) skewX(-12deg); } 100% { opacity: 0; transform: translateX(520%) skewX(-12deg); } }

  #Head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--space-default); }
  .Stroke { color: var(--on-color); -webkit-text-stroke: 1px #000; paint-order: stroke fill; }
  #Title { font-weight: 900; font-size: 28px; line-height: 32px; text-transform: uppercase; overflow-wrap: anywhere; min-width: 0; }

  #Amount {
    flex: none; padding: 6px 16px; border-radius: var(--radius-pill);
    background: rgba(15, 34, 60, .92); border: 2px solid var(--c); color: var(--c);
    font-weight: 900; font-size: 22px; line-height: 26px;
  }
  #Amount:empty { display: none; }
  #Card.Show #Amount { animation: Bump .45s .45s cubic-bezier(.34, 1.8, .64, 1) both; }
  @keyframes Bump { from { transform: scale(.6); } to { transform: scale(1); } }

  #Message {
    position: relative; margin-top: var(--space-default); padding: var(--space-card) var(--space-section);
    border-radius: var(--radius-inner); border: 1px solid var(--row-stroke); background: var(--surface);
    color: var(--ink); font-weight: 700; font-size: 22px; line-height: 30px; overflow-wrap: anywhere;
  }
  #Message:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    #Card.Show, #Card.Hide { animation-duration: .01s; }
    #Card.Show::after, #Card.Show #Amount { animation: none; }
  }
</style>
</head>
<body>
<div id="Popup">
  <div id="Card">
    <div id="Head">
      <div id="Title" class="Stroke"></div>
      <div id="Amount"></div>
    </div>
    <div id="Message"></div>
  </div>
</div>
<script>
// Hosted next to the `tts` edge function. Set once when deploying this page.
const ApiBase = "https://ojtbstbzwmhpqvdimimt.supabase.co/functions/v1/tts";

const Query = new URLSearchParams(location.search);
const UserId = Query.get("user");
const Key = Query.get("key");
const TtsOn = Query.get("tts") === "true";
const MinAmount = Number(Query.get("minAmount")) || 0;
const MaxLength = Number(Query.get("maxLength")) || 200; // characters of the message that get read aloud
const VoiceName = Query.get("voice");
const Volume = Math.min(1, Math.max(0, Number(Query.get("volume") ?? 1)));
const Demo = Query.get("demo") === "1"; // preview the popup tiers without a real donation
const ShowSeconds = 6;

const Card = document.getElementById("Card");
const Title = document.getElementById("Title");
const AmountEl = document.getElementById("Amount");
const Message = document.getElementById("Message");

const Queue = [];
let Playing = false;
let LastId = null;

function Sleep(Ms) { return new Promise((R) => setTimeout(R, Ms)); }

// Server-generated audio first (same sound in OBS on every OS); browser voices only if that fails.
function SpeakAudio(Text) {
  return new Promise((Resolve, Reject) => {
    const Url = new URL(ApiBase + "/speech");
    Url.searchParams.set("user", UserId);
    Url.searchParams.set("key", Key);
    Url.searchParams.set("text", Text);
    const Clip = new Audio(Url);
    Clip.volume = Volume;
    Clip.onended = () => Resolve();
    Clip.onerror = () => Reject(new Error("audio failed"));
    Clip.play().catch(Reject);
  });
}

async function Speak(Text) {
  if (!TtsOn || !Text) return;
  try {
    await SpeakAudio(Text);
  } catch (_) {
    await SpeakBrowser(Text);
  }
}

function SpeakBrowser(Text) {
  return new Promise((Resolve) => {
    if (!("speechSynthesis" in window)) return Resolve();
    const Utterance = new SpeechSynthesisUtterance(Text);
    Utterance.volume = Volume;
    const Voice = speechSynthesis.getVoices().find((V) => V.name === VoiceName);
    if (Voice) Utterance.voice = Voice;
    Utterance.onend = Utterance.onerror = () => Resolve();
    speechSynthesis.speak(Utterance);
  });
}

// Same thresholds as the game's DonationEffects.GetLevel; level 1-2 (under 5) share the green.
function TierFor(Amount) {
  if (Amount >= 10000) return "L7";
  if (Amount >= 1000) return "L6";
  if (Amount >= 100) return "L5";
  if (Amount >= 10) return "L4";
  if (Amount >= 5) return "L3";
  return "";
}

async function Play(Event) {
  const Text = Event.message.slice(0, MaxLength);
  Title.textContent = `${Event.donor_name} donated!`;
  AmountEl.textContent = `R$ ${Event.amount.toLocaleString()}`;
  Message.textContent = Text;
  Card.className = TierFor(Event.amount);
  void Card.offsetWidth; // restart the animation for back-to-back donations
  Card.classList.add("Show");

  const Spoken = Speak(Event.amount >= MinAmount
    ? `${Event.donor_name} donated ${Event.amount} Robux. ${Text}`
    : "");
  await Promise.all([Spoken, Sleep(ShowSeconds * 1000)]);
  Card.classList.replace("Show", "Hide");
  await Sleep(450);
}

async function Drain() {
  if (Playing) return;
  Playing = true;
  while (Queue.length) await Play(Queue.shift());
  Playing = false;
}

async function Poll() {
  try {
    const Url = new URL(ApiBase + "/events");
    Url.searchParams.set("user", UserId);
    Url.searchParams.set("key", Key);
    if (LastId !== null) Url.searchParams.set("after", LastId);
    const Res = await fetch(Url);
    window.PollStatus = `HTTP ${Res.status} at ${new Date().toLocaleTimeString()}`;
    if (Res.ok) {
      const Data = await Res.json();
      LastId = Data.last;
      Queue.push(...Data.events);
      Drain();
    }
  } catch (E) { window.PollStatus = `fetch failed: ${E.message}`; /* network blip; retry next tick */ }
  setTimeout(Poll, 2000);
}

if (Demo) {
  Queue.push(
    { donor_name: "TestDonor", amount: 5, message: "Thanks for streaming, this is a test" },
    { donor_name: "Fan01", amount: 25, message: "Keep up the great work!" },
    { donor_name: "BigSpender99", amount: 250, message: "" },
    { donor_name: "Whale", amount: 2500, message: "You deserve it, love the stream so much!" },
    { donor_name: "MegaDonator", amount: 15000, message: "Legend." },
  );
  Drain();
} else if (UserId && Key) {
  Poll();
} else {
  Title.textContent = "Overlay link is missing user or key";
  Card.classList.add("Show");
}
</script>
</body>
</html>
